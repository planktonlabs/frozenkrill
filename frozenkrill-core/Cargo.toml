[package]
name = "frozenkrill-core"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
alkali = "0.3"
libsodium-sys-stable = "1.24.5"
anyhow = { version = "1", features = ["backtrace"] }
bip39 = { version = "3", features = ["rand", "zeroize"] }
bitcoin = "0.32"
blake3 = { version = "1", features = ["rayon"] }
env_logger = "0.11"
flate2 = "1"
hex = "0.4"
itertools = "0.15"
log = "0.4"
miniscript = "13"
once_cell = "1"
rand = "0.9"
rand_core = "0.9"
rayon = "1.11"
regex = "1"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
walkdir = "2"
zeroize = { version = "1", features = ["zeroize_derive"] }

[dev-dependencies]
argon2 = { version = "0.6", features = ["zeroize"] }
chacha20poly1305 = "0.11"
mockall = "0.15"
orion = "0.18"
pretty_assertions = "1"
rargon2 = { version = "3", package = "rust-argon2" }
tempfile = "3.21"
